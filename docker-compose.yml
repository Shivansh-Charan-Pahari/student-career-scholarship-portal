version: '3.8'

services:
  web:
    build: .
    container_name: scholarship_portal_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secret-key-cse-2026
      - DATABASE_URL=sqlite:///instance/database.db
      - SESSION_COOKIE_SECURE=False
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
