{% extends 'base.html' %}

{% block title %}Create Student Account - Career Portal{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1.5rem; display: flex; justify-content: center; align-items: center; min-height: 80vh;">
  <div class="card" style="width: 100%; max-width: 480px; padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="feature-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent-emerald), #059669);">
        <i class="fas fa-user-plus"></i>
      </div>
      <h2 style="font-size: 1.65rem; margin-bottom: 0.35rem;">Create Student Account</h2>
      <p style="font-size: 0.9rem;">Join thousands of students discovering opportunities</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" id="register-form">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" name="name" id="name" class="form-control" placeholder="e.g. Rahul Sharma" value="{{ name or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="name@college.edu or gmail.com" value="{{ email or '' }}" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 chars)</label>
          <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="register-submit-btn">
        <i class="fas fa-arrow-right"></i> Register & Set Up Profile
      </button>
    </form>

    <div style="margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.875rem;">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 700;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
